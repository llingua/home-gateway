openapi: 3.1.0
info:
  title: home-gateway
  version: 0.1.0
  description: |
    Livello di integrazione di casa Belinchebon. Sola lettura, nessun dato personale.
    Autenticazione: Cloudflare Access (service token). Intestazioni da inviare:
    `CF-Access-Client-Id` e `CF-Access-Client-Secret`.
servers:
  - url: https://gateway.belinchebon.com
security:
  - accessServiceToken: []
paths:
  /healthz:
    get:
      summary: Il Worker è vivo (senza autenticazione)
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, service: { type: string } } }
  /v1/capabilities:
    get:
      summary: Sezioni disponibili e permessi del cliente
      responses:
        "200":
          description: elenco
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { type: string }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        scope: { type: string }
                        cacheSeconds: { type: integer }
                        allowed: { type: boolean }
                        path: { type: string }
  /mcp:
    post:
      summary: Interfaccia MCP (JSON-RPC 2.0) per agenti come Claude
      description: >
        Metodi: initialize, ping, tools/list, tools/call. Strumenti di lettura (get_overview e uno per sezione) e, con permesso
        config:write e archivio STATE, di scrittura con approvazione (propose_*, apply_plan, propose_undo, get_plan, get_audit_log);
        filtrati in base ai permessi del cliente. Vedi docs/CLIENT-CLAUDE.md.
        Le richieste con intestazione Origin sono rifiutate; dimensione massima 64 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { jsonrpc: { type: string, enum: ["2.0"] }, id: {}, method: { type: string }, params: { type: object } } }
      responses:
        "200": { description: risposta JSON-RPC }
        "202": { description: notifica accettata (nessun corpo) }
        "400": { description: JSON non valido o versione del protocollo non supportata }
        "403": { description: Origin non ammessa }
        "405": { description: metodo diverso da POST }
        "413": { description: richiesta troppo grande }
  /approve/{planId}:
    get:
      summary: Pagina di approvazione di un piano (solo persone, app Access dedicata)
      description: >
        Non per i clienti API: serve a una persona autorizzata (email in APPROVERS) per leggere un piano di modifica e
        approvarlo o rifiutarlo (POST con token CSRF). I service token non possono approvare. Vedi docs/APPROVAZIONI.md.
      security: []
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{32}$" } }
      responses:
        "200": { description: pagina HTML del piano }
        "403": { description: persona non autorizzata }
        "404": { description: piano inesistente o scaduto }
        "503": { description: approvazioni non configurate }
  /v1/media/overview:
    get:
      summary: Tutte le sezioni in una sola richiesta
      parameters:
        - name: sections
          in: query
          required: false
          description: Elenco separato da virgole (es. streams,queue). Se omesso, tutte.
          schema: { type: string }
      responses:
        "200":
          description: sezioni
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  sections:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/Section" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/config/overview:
    get:
      summary: Audit delle impostazioni di tutti i servizi (permesso config:read)
      description: >
        Senza permesso config:read è un 403. Le risposte non contengono chiavi, password, indirizzi IP né credenziali di
        indexer e client di download.
      parameters:
        - name: sections
          in: query
          required: false
          description: Elenco separato da virgole (es. config_radarr,config_qbittorrent).
          schema: { type: string }
      responses:
        "200":
          description: sezioni di configurazione
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  sections:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/Section" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/config/{service}:
    get:
      summary: Impostazioni di un servizio (permesso config:read)
      parameters:
        - name: service
          in: path
          required: true
          schema: { type: string, enum: [radarr, sonarr, prowlarr, qbittorrent, cleanuparr] }
      responses:
        "200":
          description: sezione di configurazione
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/media/{section}:
    get:
      summary: Una sezione
      description: >
        Sezioni: streams (riproduzioni Plex), downloads (qBittorrent), requests (Overseerr), recent (ultimo contenuto disponibile),
        queue (code Radarr/Sonarr), upcoming (prossime uscite), library (librerie Plex e mancanti),
        storage (spazio libero), health (avvisi di salute), indexers (indexer Prowlarr), subtitles (sottotitoli mancanti, Bazarr), proxmox (host, guest, storage, ultimo backup).
      parameters:
        - name: section
          in: path
          required: true
          schema: { type: string, enum: [streams, downloads, requests, recent, queue, upcoming, library, storage, health, indexers, subtitles, proxmox] }
      responses:
        "200":
          description: sezione
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    accessServiceToken:
      type: apiKey
      in: header
      name: CF-Access-Client-Id
      description: Va inviata anche CF-Access-Client-Secret.
  schemas:
    Section:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, error, unconfigured] }
        data: { description: Dati della sezione (la forma dipende dalla sezione) }
        error: { type: string, description: Messaggio breve, senza dati sensibili }
        warnings:
          type: array
          items: { type: string }
          description: Problemi parziali (un servizio ha risposto, un altro no)
        cached: { type: boolean }
  responses:
    Error:
      description: Errore
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
